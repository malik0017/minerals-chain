{% extends "layouts/base_auth.html" %}
{% block title %}Verify your identity{% endblock %}
{% block content %}

<h4 class="text-center mb-1"><i class="bi bi-shield-lock"></i> Two-factor authentication</h4>
<p class="text-secondary text-center mb-4">Enter the 6-digit code from your authenticator app.</p>

{% if error %}
<div class="alert alert-danger py-2">{{ error }}</div>
{% endif %}

<form method="post" action="{{ url_for('login_2fa_submit') }}">
  <div class="mb-3">
    <label class="form-label" for="code">Authentication code</label>
    <input class="form-control text-center fs-4 letter-spacing-2" type="text" id="code" name="code"
           inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required autofocus />
  </div>
  <button type="submit" class="btn btn-theme w-100 mt-2">Verify</button>
</form>

<p class="text-center text-secondary mt-4 mb-0">
  <a href="{{ url_for('login_form') }}">Back to login</a>
</p>

{% endblock %}

upstream minerals_app {
    server 127.0.0.1:8000;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=mc_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=mc_api:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name mineralschain.sa www.mineralschain.sa;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://mineralschain.sa$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.mineralschain.sa;
    ssl_certificate     /etc/letsencrypt/live/mineralschain.sa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mineralschain.sa/privkey.pem;
    return 301 https://mineralschain.sa$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mineralschain.sa;

    ssl_certificate     /etc/letsencrypt/live/mineralschain.sa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mineralschain.sa/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;


    client_max_body_size 12m;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    access_log /var/log/nginx/minerals.access.log;
    error_log  /var/log/nginx/minerals.error.log warn;

    location /static/uploads/ {
        alias /srv/minerals/app/app/static/uploads/;
        expires 1h;
        add_header X-Content-Type-Options nosniff always;
        location ~* \.(php|py|sh|html?)$ { deny all; }
    }

    location /static/ {
        alias /srv/minerals/app/app/static/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /assets/ {
        alias /srv/minerals/app/app/static/;
        expires 7d;
        access_log off;
    }

    location = /sw.js {
        proxy_pass http://minerals_app;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache";
    }

    location = /login {
        limit_req zone=mc_login burst=20 nodelay;
        proxy_pass http://minerals_app;
        include /etc/nginx/snippets/minerals-proxy.conf;
    }

    location /api/ {
        limit_req zone=mc_api burst=40 nodelay;
        proxy_pass http://minerals_app;
        include /etc/nginx/snippets/minerals-proxy.conf;
    }

    location ~ ^/(storage|backups|alembic|scripts|deploy|tests|\.env|\.git) { return 404; }

    location / {
        proxy_pass http://minerals_app;
        include /etc/nginx/snippets/minerals-proxy.conf;
    }
}
